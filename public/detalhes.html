
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Jogo | Gamerboxd</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/detalhes.css">
</head>

<body>

    <header class="cabecalho">
        <a class="marca" href="index.html">Gamerboxd</a>

        <nav>
            <a href="index.html">Início</a>
        </nav>
    </header>

    <main class="pagina-detalhes">

        <section class="detalhes-jogo">

            <div class="capa-jogo">
                <img id="capa" src="" alt="Capa do jogo">
            </div>

            <div class="informacoes-jogo">

                <h1 id="nome"></h1>

                <div class="generos" id="generos"></div>

                <p><strong>Desenvolvedora:</strong> 
                    <span id="desenvolvedora"></span>
                </p>

                <p><strong>Ano de lançamento:</strong> 
                    <span id="ano"></span>
                </p>

                <p><strong>Plataformas:</strong> 
                    <span id="plataformas"></span>
                </p>

                <div class="descricao-jogo">
                    <h2>Sobre o jogo</h2>
                    <p id="descricao"></p>
                </div>

            </div>
        </section>

        <section class="galeria-jogo">
            <h2>Imagens do jogo</h2>
            <div class="lista-imagens" id="lista-imagens"></div>
        </section>
    </main>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/detalhes.js"></script>

</body>
</html>
