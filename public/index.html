
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameboxd</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header class="cabecalho">
        <a class="marca" href="#inicio">
            <span>Gameboxd</span>
        </a>

        <input type="search" placeholder="Buscar jogos... (digitável, mas ainda fora de funcionamento!)">
    </header>

    <main id="inicio">

        <section class="destaques">
            <h2>Destaques da semana</h2>
            <p>Confira alguns jogos em destaque.</p>
            
            <div class="carrossel">
                <div class="lista-destaques">
        
                </div>
            </div>
            <div class="indicadores">
                <span class="indicador"></span>
            </div>
            <div class="botoes-destaque">
                <button class="anterior">Anterior</button>
                <button class="proximo">Próximo</button>
            </div>
        </section>  

        <section class="catalogo" id="biblioteca">

            <h2>Todos os jogos</h2>

            <div class="lista-jogos">

            </div>

        </section>

    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
