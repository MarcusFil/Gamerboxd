
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameboxd</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header class="cabecalho">
        <a class="marca" href="#inicio">
            <span>Gameboxd</span>
        </a>

        <input type="search" placeholder="Buscar jogos...">
    </header>

    <main id="inicio">

        <section class="destaques">
            <h2>Destaques da semana</h2>
            <p>Confira alguns jogos em destaque.</p>
            <div class="carrossel">
                <button class="anterior">Anterior</button>
                <div class="lista-destaques">
        
                </div>
                <button class="proximo">Próximo</button>
            </div>
        </section>  

        <section class="catalogo" id="biblioteca">

            <h2>Todos os jogos</h2>

            <div class="lista-jogos">

                <article class="jogo">
                    <img src="https://picsum.photos/seed/reddead/500/300" alt="Capa de Red Dead Redemption 2">
                    <h3>Red Dead Redemption 2</h3>
                </article>

                <article class="jogo">
                    <img src="https://picsum.photos/seed/lastofus/500/300" alt="Capa de The Last of Us Part I">
                    <h3>The Last of Us Part I</h3>
                </article>

                <article class="jogo">
                    <img src="https://picsum.photos/seed/godofwar/500/300" alt="Capa de God of War Ragnarök">
                    <h3>God of War Ragnarök</h3>
                </article>

                <article class="jogo">
                    <img src="https://picsum.photos/seed/horizon/500/300" alt="Capa de Horizon Forbidden West">
                    <h3>Horizon Forbidden West</h3>
                </article>

                <article class="jogo">
                    <img src="https://picsum.photos/seed/eldenring/500/300" alt="Capa de Elden Ring">
                    <h3>Elden Ring</h3>
                </article>

                <article class="jogo">
                    <img src="https://picsum.photos/seed/baldursgate/500/300" alt="Capa de Baldur's Gate 3">
                    <h3>Baldur's Gate 3</h3>
                </article>

                <article class="jogo">
                    <img src="https://picsum.photos/seed/starfield/500/300" alt="Capa de Starfield">
                    <h3>Starfield</h3>
                </article>

                <article class="jogo">
                    <img src="https://picsum.photos/seed/spiderman/500/300" alt="Capa de Spider-Man 2">
                    <h3>Spider-Man 2</h3>
                </article>

            </div>

        </section>

    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
